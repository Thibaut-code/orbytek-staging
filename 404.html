  <title>Page introuvable · Orbytek</title>
  <script>
    // GitHub Pages distinguishes letter case. Normalize only the album entry URL.
    if (/^\/bd\/albert(?:\/(?:index\.html)?)?$/i.test(location.pathname)
        && location.pathname !== '/BD/albert/') {
      location.replace('/BD/albert/' + location.search + location.hash);
    }
  </script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5efdf;color:#312d27;font-family:Georgia,serif}
    main{max-width:560px;padding:32px}h1{font-size:40px;font-weight:normal}p{line-height:1.7}a{color:#914c30}
  </style>
</head>
<body>
  <main>
    <h1>Page introuvable</h1>

  </main>
</body>
