</style></head><body>
<div class="demo-banner"><strong>DÉMONSTRATION ORBYTEK</strong> · Réservations fictives, conservées dans ce navigateur.<button type="button" data-action="reset">Réinitialiser la démo</button></div>
<div id="root"></div>

<noscript>Activez JavaScript pour utiliser cette démonstration.</noscript>

<script>
'use strict';
// Données et règles de la démo : aucun appel réseau ni serveur.
const SERVICES=[{id:'coupe',name:'Coupe & coiffage',description:'Une coupe qui vous ressemble, un coiffage tout en légèreté.',duration:45,price:45,icon:'✂'},{id:'brushing',name:'Brushing signature',description:'Du mouvement, de la brillance et une finition impeccable.',duration:30,price:30,icon:'≈'},{id:'couleur',name:'Couleur & soin',description:'Une couleur lumineuse, sublimée par un soin profond.',duration:90,price:85,icon:'◐'},{id:'homme',name:'Coupe homme',description:'Une coupe précise, adaptée à votre style.',duration:30,price:28,icon:'↗'}];
const STAFF=['Camille','Alex'];
const STORAGE_KEY='atelier-demo-v2';
const time=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Brussels',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>p.find(x=>x.type===t).value;return get('year')+'-'+get('month')+'-'+get('day')}
function addDays(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function openDay(date){return /^\d{4}-\d{2}-\d{2}$/.test(date)&&!isNaN(+new Date(date+'T12:00:00Z'))&&new Date(date+'T12:00:00Z').toISOString().slice(0,10)===date&&![0,1].includes(new Date(date+'T12:00:00Z').getUTCDay())}
function validDate(date){return openDay(date)&&date>=today()&&date<=addDays(today(),89)}
function future(date,start){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Brussels',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).split(':').map(Number);return date>today()||(date===today()&&start>p[0]*60+p[1]+60)}
function nextOpenDate(){let d=today();for(let i=0;i<8;i++,d=addDays(d,1))if(validDate(d)&&future(d,1035))return d;return d}
const serviceById=id=>SERVICES.find(s=>s.id===id);
function cleanRows(rows){return Array.isArray(rows)?rows.filter(b=>b&&typeof b.id==='string'&&typeof b.date==='string'&&openDay(b.date)&&serviceById(b.service)&&STAFF.includes(b.staff)&&Number.isInteger(b.start)&&b.start>=540&&b.start+serviceById(b.service).duration<=1080&&b.start%15===0&&['name','email','phone'].every(k=>typeof b[k]==='string')).map(b=>({...b,duration:serviceById(b.service).duration})):[]}
function seedRows(existing=[]){let day=nextOpenDate();const result=[...existing];const names=['Louise Martin','Hugo Laurent','Emma Bernard','Lucas Petit','Chloé Dubois','Gabriel Simon','Jade Moreau','Arthur Leroy','Alice Fontaine','Louis Lambert'];for(let d=0;d<5;d++){while(!openDay(day))day=addDays(day,1);const plan=[['Camille',540,'coupe'],['Alex',570,'homme'],['Camille',660,'couleur'],['Alex',720,'coupe'],['Camille',840,'brushing'],['Alex',900,'coupe']];plan.forEach(([staff,start,service],i)=>{const s=serviceById(service);if(result.some(b=>b.date===day&&b.staff===staff&&start<b.start+b.duration&&start+s.duration>b.start))return;const name=names[(d*3+i)%names.length];result.push({id:'DEMO-'+day.replaceAll('-','')+'-'+i,date:day,staff,start,service,duration:s.duration,name,email:'client'+(d*6+i+1)+'@example.com',phone:'+32 470 00 '+String(d+10)+' '+String(i+10),sample:true})});day=addDays(day,1)}return result}
let memory=[];
let persistent=true;
function loadRows(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw!==null)return cleanRows(JSON.parse(raw));const legacy=cleanRows(JSON.parse(localStorage.getItem('atelier-demo-v1')||'[]')).filter(b=>b.id!=='DEMO-EXEMPLE');const rows=seedRows(legacy);localStorage.setItem(STORAGE_KEY,JSON.stringify(rows));return rows}catch{persistent=false;return seedRows()}}
function persist(rows){memory=rows;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(rows));persistent=true}catch{persistent=false}}
memory=loadRows();
function availableSlots(date,service,staff,excludeId=''){const s=serviceById(service);if(!s||!STAFF.includes(staff)||!validDate(date))return [];const slots=[];for(let start=540;start+s.duration<=1080;start+=15)if(future(date,start)&&!memory.some(b=>b.id!==excludeId&&b.date===date&&b.staff===staff&&start<b.start+b.duration&&start+s.duration>b.start))slots.push(start);return slots}
function saveAppointment(input,id=''){const s=serviceById(input.service);if(id&&!memory.some(b=>b.id===id))throw Error('Ce rendez-vous a été supprimé.');if(!s||!STAFF.includes(input.staff)||!validDate(input.date))throw Error('Choisissez une date du mardi au samedi dans les 89 prochains jours.');if(!Number.isInteger(input.start)||!availableSlots(input.date,input.service,input.staff,id).includes(input.start))throw Error('Ce créneau est indisponible. Choisissez un autre horaire.');if(typeof input.name!=='string'||input.name.trim().length<2||input.name.length>100||typeof input.email!=='string'||input.email.length>200||!/^\S+@\S+\.\S+$/.test(input.email)||typeof input.phone!=='string'||!/^\+?[0-9 () .\-]{7,25}$/.test(input.phone))throw Error('Vérifiez les coordonnées fictives du client.');const old=memory.find(b=>b.id===id);const row={...old,id:id||'DEMO-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),date:input.date,service:input.service,staff:input.staff,start:input.start,duration:s.duration,name:input.name.trim(),email:input.email.trim(),phone:input.phone.trim()};persist(id?memory.map(b=>b.id===id?row:b):[...memory,row]);return row}
function cancelAppointment(id){persist(memory.filter(b=>b.id!==id))}
function matchingRows(date,q=''){const needle=q.trim().toLocaleLowerCase();return memory.filter(b=>needle?[b.name,b.email,b.phone,b.id].some(v=>v.toLocaleLowerCase().includes(needle)):b.date===date).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start||a.staff.localeCompare(b.staff))}
// Interface : rendu natif, sans dépendance et sans compilation.
const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const longDate=date=>new Date(date+'T12:00:00Z').toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'});
const shortDate=date=>new Date(date+'T12:00:00Z').toLocaleDateString('fr-BE',{day:'numeric',month:'long'});
const money=n=>n.toLocaleString('fr-BE')+' €';
const state={view:'booking',step:1,date:nextOpenDate(),calendarMonth:nextOpenDate().slice(0,7),service:'coupe',staff:'Camille',start:null,contact:{name:'',email:'',phone:'',consent:false},confirmedId:'',agendaDate:nextOpenDate(),search:'',agendaView:'planning'};
let toastTimer;
function toast(message){const node=$('#toast');node.textContent=message;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,4500)}
function header(){return `<header><a class="logo" href="#" data-action="home">atelier<span>·</span><small>LA BEAUTÉ DU TEMPS POUR SOI</small></a><nav aria-label="Navigation principale"><button class="${state.view==='booking'?'active':''}" data-action="booking">Prendre rendez-vous</button><button class="${state.view==='agenda'?'active':''}" data-action="agenda">Espace salon <span>↗</span></button></nav><span class="header-note">COIFFURE & SOIN</span></header>`}
function hero(){return `<section class="intro"><div class="hero-copy"><div class="eyebrow"><span></span>L’ART DE PRENDRE SOIN DE VOUS</div><h1>Votre allure.<br>Votre signature.<br><em>Votre moment.</em></h1><p>Une coupe juste. Une couleur qui vous révèle.<br>Accordez-vous une parenthèse, on imagine la suite ensemble.</p><a class="hero-cta" href="#reservation">Réserver mon moment <span>↗</span></a><div class="hero-meta"><span>COUPE</span><i></i><span>COULEUR</span><i></i><span>SOIN</span></div></div><div class="hero-image"><img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1500&q=85" alt="Intérieur lumineux d’un salon de coiffure" fetchpriority="high"><span class="image-caption">L’INSPIRATION ATELIER</span><div class="image-note"><span>01 / LA PARENTHÈSE</span><p>Le luxe,<br><em>c’est du temps pour soi.</em></p></div></div><span class="hero-wordmark" aria-hidden="true">atelier.</span></section><div class="ritual-strip"><span>UNE ATTENTION PERSONNELLE</span><i>✳</i><span>UN STYLE SINGULIER</span><i>✳</i><span>LE PLAISIR DE SE RETROUVER</span></div>`}
function footer(){return `<footer><div class="footer-statement">La beauté du geste.<br><em>Le plaisir d’être soi.</em></div><span class="footer-logo">atelier·</span><span>Un peu de temps. Beaucoup de vous.</span><span>Démonstration Orbytek · Europe/Brussels</span></footer>`}
function icon(name){const paths={calendar:'M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z',clock:'M12 8v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',user:'M20 21v-2a6 6 0 0 0-6-6h-4a6 6 0 0 0-6 6v2M16 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0',mail:'m3 5 9 7 9-7M3 5h18v14H3Z',check:'m5 12 4 4L19 6',sun:'M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',spark:'m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z'};return `<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.spark}"/></svg>`}
function portrait(index){return `<svg viewBox="0 0 100 112" role="img" aria-label="Portrait illustré de ${STAFF[index]}"><rect width="100" height="112" rx="48" fill="${index?'#dce0d4':'#e6d6c0'}"/><path d="M14 112c0-27 15-39 36-39s36 12 36 39" fill="${index?'#63725d':'#8b7158'}"/><path d="M39 69h22v21c-6 8-16 8-22 0" fill="#c89c7c"/><ellipse cx="50" cy="47" rx="23" ry="30" fill="#dcb798"/>${index?'<path d="M26 47V29c5-24 52-22 48 9-8-2-18-7-22-12-5 12-18 15-26 15" fill="#49473a"/><path d="M33 61c8 12 26 12 34 0-1 23-32 23-34 0" fill="#605244"/>':'<path d="M25 73c-8-33-5-58 25-58s34 25 25 58l-10-8c5-18 2-27-2-33-6 9-18 13-33 12l5 23Z" fill="#64503e"/>'}<path d="M39 49h3m16 0h3M45 64c3 2 7 2 10 0" fill="none" stroke="#6b4d3c" stroke-width="2" stroke-linecap="round"/></svg>`}
function calendar(){const month=state.calendarMonth||state.date.slice(0,7);const first=month+'-01';const offset=(new Date(first+'T12:00:00Z').getUTCDay()+6)%7;const days=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate();const title=new Date(first+'T12:00:00Z').toLocaleDateString('fr-BE',{month:'long',year:'numeric'});return `<div class="calendar-panel"><div class="calendar-top"><div><span class="eyebrow">VOTRE PROCHAIN MOMENT</span><h3>${esc(title)}</h3></div><div class="calendar-nav"><button type="button" class="outline" data-month="-1" aria-label="Mois précédent" ${month<=today().slice(0,7)?'disabled':''}>←</button><button type="button" class="outline" data-month="1" aria-label="Mois suivant" ${month>=addDays(today(),89).slice(0,7)?'disabled':''}>→</button></div></div><div class="calendar-week" aria-hidden="true">${['L','M','M','J','V','S','D'].map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-days" role="group" aria-label="Choisir un jour en ${esc(title)}">${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0');const count=availableSlots(date,state.service,state.staff).length;const chosen=state.date===date;return `<button type="button" data-date="${date}" class="calendar-day ${chosen?'chosen':''} ${count?'has-slots':''}" aria-pressed="${chosen}" aria-label="${esc(longDate(date))}, ${count?count+' horaires disponibles':'indisponible'}" ${!count?'disabled':''}><span>${i+1}</span><i aria-hidden="true"></i></button>`}).join('')}</div><div class="calendar-key"><span><i></i>Horaires disponibles</span><span>Heure de Bruxelles</span></div></div>`}
function slotGroups(slots){if(!slots.length)return `<p class="empty">${openDay(state.date)?'Aucun horaire disponible. Essayez un autre jour ou un autre expert.':'Le salon est fermé le dimanche et le lundi.'}</p>`;return `<div class="selected-date-label">${icon('calendar')}<div><span>Les disponibilités du</span><b>${esc(longDate(state.date))}</b></div></div>${[{label:'Matin',filter:m=>m<720},{label:'Après-midi',filter:m=>m>=720}].map(group=>{const times=slots.filter(group.filter);return times.length?`<section class="slot-group" aria-label="${group.label}"><h4>${icon('sun')}${group.label}<small>${times.length} horaires</small></h4><div class="slots">${times.map(m=>`<button type="button" data-slot="${m}" class="${state.start===m?'chosen':''}" aria-pressed="${state.start===m}">${time(m)}${state.start===m?'<span aria-hidden="true"> ✓</span>':''}</button>`).join('')}</div></section>`:''}).join('')}`}
function mobileAction(){if(state.step===3)return '';const s=serviceById(state.service);return `<div class="mobile-action"><div><b>${s.name} · ${s.price} €</b><small>${state.start===null?'Choisissez votre horaire':shortDate(state.date)+' · '+time(state.start)}</small></div>${state.step===1?`<button class="primary" data-action="continue" ${state.start===null?'disabled':''}>Continuer →</button>`:'<button class="primary" type="submit" form="booking-form">Confirmer ✓</button>'}</div>`}
function bookingChoice(){const slots=availableSlots(state.date,state.service,state.staff);return `<div class="section-title"><span>01</span><div><h2>Qu’est-ce qui vous ferait plaisir ?</h2><p>À chaque envie, son attention.</p></div></div><div class="services">${SERVICES.map(s=>`<button class="service ${s.id===state.service?'selected':''}" data-service="${s.id}" aria-pressed="${s.id===state.service}"><span class="service-icon">${s.icon}</span><div><h3>${s.name}</h3><p>${s.description}</p><small>${icon('clock')}${s.duration} min</small></div><div class="price">${s.price} €<span class="radio">${s.id===state.service?'✓':''}</span></div></button>`).join('')}</div><div class="section-title"><span>02</span><div><h2>Entre de bonnes mains</h2><p>Deux personnalités, la même attention au détail.</p></div></div><div class="staff expert-cards">${STAFF.map((name,i)=>`<button class="expert-card ${name===state.staff?'chosen':''}" data-staff="${name}" aria-pressed="${name===state.staff}"><div class="expert-portrait">${portrait(i)}</div><div class="expert-copy"><b>${name}</b><small>${i?'Coiffeur & styliste':'Coiffeuse & coloriste'}</small><p>${i?'Coupes précises, style naturel.':'Couleurs lumineuses, écoute attentive.'}</p></div><span class="expert-check" aria-hidden="true">${name===state.staff?'✓':'+'}</span></button>`).join('')}</div><div class="section-title"><span>03</span><div><h2>Trouvez votre moment</h2><p>Du mardi au samedi, de 9 h à 18 h.</p></div></div>${calendar()}<details class="date-alternative"><summary>Saisir une date précise</summary><label class="date-label">Date du rendez-vous<input id="booking-date" type="date" min="${today()}" max="${addDays(today(),89)}" value="${state.date}" required></label></details>${slotGroups(slots)}`}
function contactForm(){const c=state.contact;return `<form id="booking-form"><button type="button" class="back" data-action="back">← Modifier mon rendez-vous</button><h2>Faisons connaissance.</h2><p>Testez le parcours avec des coordonnées fictives.</p><div class="prefill"><p><strong>Envie de tester en quelques secondes ?</strong><br>Un profil fictif est prêt pour vous.</p><button type="button" class="outline" data-action="prefill">Remplir avec un exemple ↗</button></div><label>Nom et prénom<input name="name" autocomplete="off" minlength="2" maxlength="100" required placeholder="Votre nom complet" value="${esc(c.name)}"></label><label>Adresse e-mail<input name="email" type="email" autocomplete="off" maxlength="200" required placeholder="vous@exemple.be" value="${esc(c.email)}"></label><label>Téléphone<input name="phone" type="tel" autocomplete="off" minlength="7" maxlength="25" required placeholder="+32 470 00 00 00" value="${esc(c.phone)}"></label><label class="consent"><input type="checkbox" name="consent" required ${c.consent?'checked':''}>J’ai compris qu’il s’agit d’une simulation. Ces coordonnées fictives restent dans ce navigateur et aucun message ne sera envoyé.</label><p id="booking-error" class="error" role="alert" hidden></p></form>`}
function confirmation(){const b=memory.find(b=>b.id===state.confirmedId);if(!b)return `<p class="empty">Ce rendez-vous n’existe plus dans la démo.</p><button class="primary" data-action="new">Créer un rendez-vous →</button>`;return `<div class="success refined-success"><span>${icon('check')}</span><div class="eyebrow">VOTRE PARENTHÈSE EST RÉSERVÉE</div><h2>On prend soin de la suite.</h2><p>Votre réservation a été ajoutée à l’agenda de démonstration.</p><div class="confirmation-ticket"><div class="ticket-date"><small>${new Date(b.date+'T12:00:00Z').toLocaleDateString('fr-BE',{weekday:'long'})}</small><strong>${b.date.slice(-2)}</strong><span>${new Date(b.date+'T12:00:00Z').toLocaleDateString('fr-BE',{month:'long',year:'numeric'})}</span></div><div class="ticket-details"><strong>${time(b.start)}</strong><b>${serviceById(b.service).name}</b><span>Avec ${b.staff} · ${b.duration} minutes</span><code>${esc(b.id)}</code></div></div><div class="confirmation-email">${icon('mail')}<p><b>Une confirmation par e-mail pour vos clients.</b><br>Fonctionnalité prévue pour la version client ; aucun e-mail n’est envoyé dans cette démo.</p></div><small>Simulation uniquement. Aucun rendez-vous réel.</small><div class="success-actions"><button class="primary" data-edit="${esc(b.id)}">Modifier ce rendez-vous ↗</button><button class="primary" data-action="show-confirmed">Voir dans le planning →</button></div><button class="back" data-action="new">Prendre un autre rendez-vous</button></div>`}
function summary(){const b=state.step===3?memory.find(b=>b.id===state.confirmedId):null;const s=serviceById(b?.service||state.service);const date=b?.date||state.date,staff=b?.staff||state.staff,start=b?.start??state.start;return `<aside><div class="summary refined-summary"><div class="eyebrow">VOTRE PARENTHÈSE</div><h2>Un moment<br><em>rien qu’à vous.</em></h2><div class="summary-service"><span>${s.icon}</span><div><b>${s.name}</b><small>${s.duration} minutes de soin et d’attention</small></div></div><div class="summary-details"><div>${icon('user')}<div><small>Votre expert</small><b>${staff}</b></div></div><div>${icon('calendar')}<div><small>Votre journée</small><b>${esc(longDate(date))}</b></div></div><div>${icon('clock')}<div><small>Votre horaire</small><b>${start===null?'Choisissez votre moment':time(start)+' — '+time(start+s.duration)}</b></div></div></div><div class="summary-total"><div><span>Votre prestation</span><small>Règlement au salon · montant fictif</small></div><strong>${s.price}<small> €</small></strong></div>${state.step===1?`<button class="primary" data-action="continue" ${start===null?'disabled':''}>Continuer <span>→</span></button>`:state.step===2?'<button class="primary" type="submit" form="booking-form">Confirmer la réservation démo <span>✓</span></button>':'<div class="confirmed">✓ Réservation démo confirmée</div>'}<p class="secure">Aucun prépaiement · Aucun rendez-vous réel</p><div class="summary-email">${icon('mail')}<p><b>Confirmation par e-mail</b><br>Prévue dans la version client.<br>Aucun e-mail envoyé dans cette démo.</p></div></div><div class="info"><span>✧</span><p><b>Le temps de bien faire.</b><br>Chaque prestation inclut un échange personnalisé avec votre expert.</p></div><div class="hours"><b>LES HORAIRES DU SALON</b><p>Mardi — Samedi <span>9 h — 18 h</span></p><p>Dimanche & Lundi <span>Fermé</span></p></div></aside>`}
function bookingPage(){return `${hero()}<section class="booking-heading" id="reservation"><div><div class="eyebrow">VOTRE PROCHAINE VISITE</div><h2>Faites place à <em>votre moment.</em></h2></div><p>Votre prestation, votre expert, votre horaire.<br>Quelques instants pour réserver.</p></section><section class="workspace"><main><div class="demo-tools"><p><strong>Explorez l’expérience d’un salon connecté.</strong>Réservez un créneau, puis retrouvez-le dans l’agenda.</p><button class="outline" data-action="agenda">Découvrir le planning ↗</button></div><div class="steps">${['Votre rendez-vous','Vos coordonnées','Confirmation'].map((s,i)=>`${i?'<i></i>':''}<span class="${state.step===i+1?'current':''}" ${state.step===i+1?'aria-current="step"':''}>0${i+1} <b>${s}</b></span>`).join('')}</div>${state.step===1?bookingChoice():state.step===2?contactForm():confirmation()}</main>${summary()}</section>${mobileAction()}`}
function agendaPage(){return `<section class="admin"><div class="eyebrow">ESPACE SALON · DÉMONSTRATION</div><h1>Votre agenda,<br><em>tout simplement.</em></h1><p>Un salon déjà en mouvement. Cliquez sur un rendez-vous pour le modifier.</p><div class="demo-stats" id="agenda-stats"></div><div class="search-box"><label for="client-search">Retrouver un rendez-vous</label><div class="search-field"><span aria-hidden="true">⌕</span><input id="client-search" type="search" maxlength="100" placeholder="Nom, e-mail, téléphone ou référence…" value="${esc(state.search)}" autocomplete="off"><button type="button" data-action="clear-search" aria-label="Effacer la recherche">×</button></div><p>Recherchez dans toutes les dates. Les données présentées sont fictives.</p></div><div class="agenda-toolbar"><div class="agenda-date"><button class="outline" data-day="-1" aria-label="Jour précédent">←</button><label><span class="eyebrow" style="margin-bottom:7px">JOURNÉE DU SALON</span><input id="agenda-date" type="date" value="${state.agendaDate}" aria-label="Journée du salon"></label><button class="outline" data-day="1" aria-label="Jour suivant">→</button></div><div class="view-toggle" aria-label="Affichage de l’agenda"><button data-display="planning" class="${state.agendaView==='planning'?'active':''}" aria-pressed="${state.agendaView==='planning'}">Planning</button><button data-display="list" class="${state.agendaView==='list'?'active':''}" aria-pressed="${state.agendaView==='list'}">Liste</button></div><button class="outline" data-action="reserve-from-agenda">+ Rendez-vous démo</button></div><div id="agenda-results" aria-live="polite"></div></section>`}
function listRows(rows){return `<div class="agenda-list">${rows.map(b=>`<article class="appointment ${b.staff==='Alex'?'alex':''}"><div class="appointment-time"><span class="appointment-date">${esc(shortDate(b.date))}</span>${time(b.start)}<small>jusqu’à ${time(b.start+b.duration)}</small></div><div><h3>${serviceById(b.service).name}</h3><p>${esc(b.name)} · ${b.staff}</p><a href="mailto:${esc(b.email)}">${esc(b.email)}</a><br><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><code>Réf. ${esc(b.id)}</code></div><div class="appointment-actions"><button class="outline" data-edit="${esc(b.id)}">Modifier ↗</button><button class="cancel" data-cancel="${esc(b.id)}">Annuler</button></div></article>`).join('')}</div>`}
function planning(rows){return `<div class="planning-legend"><span>Camille · coloriste</span><span>Alex · styliste</span></div><div class="planning-wrap"><div class="planning"><div class="planning-head"><div></div>${STAFF.map((staff,i)=>`<div><span class="avatar a${i}">${staff[0]}</span><div><b>${staff}</b><small>${rows.filter(b=>b.staff===staff).length} rendez-vous</small></div></div>`).join('')}</div><div class="planning-body"><div class="time-scale">${Array.from({length:10},(_,i)=>`<span style="top:${i/9*100}%">${String(i+9).padStart(2,'0')}:00</span>`).join('')}</div>${STAFF.map(staff=>`<div class="planning-lane" aria-label="Planning de ${staff}">${rows.filter(b=>b.staff===staff).map(b=>`<button class="planning-card ${staff==='Alex'?'alex':''}" data-edit="${esc(b.id)}" style="top:${(b.start-540)/540*100}%;height:${b.duration/540*100}%" aria-label="Modifier : ${esc(b.name)}, ${serviceById(b.service).name}, ${time(b.start)} à ${time(b.start+b.duration)}, avec ${staff}"><b>${time(b.start)} · ${esc(b.name)}</b><span>${serviceById(b.service).name}</span>${b.duration>=45?`<small>${b.duration} min · ${serviceById(b.service).price} €</small>`:''}</button>`).join('')}</div>`).join('')}</div></div></div><p class="planning-help">Cliquez sur une carte pour déplacer le rendez-vous, changer la prestation ou le professionnel.</p>`}
function renderAgendaResults(){if(state.view!=='agenda')return;const dayRows=matchingRows(state.agendaDate);const rows=matchingRows(state.agendaDate,state.search);const total=dayRows.reduce((n,b)=>n+serviceById(b.service).price,0);const minutes=dayRows.reduce((n,b)=>n+b.duration,0);$('#agenda-stats').innerHTML=`<div class="demo-stat"><span>RENDEZ-VOUS DU JOUR</span><b>${dayRows.length}</b><small>${esc(shortDate(state.agendaDate))}</small></div><div class="demo-stat"><span>CHIFFRE D’AFFAIRES ESTIMÉ</span><b>${money(total)}</b><small>Montants fictifs des prestations</small></div><div class="demo-stat"><span>TEMPS RÉSERVÉ</span><b>${Math.floor(minutes/60)} h ${String(minutes%60).padStart(2,'0')}</b><small>Camille et Alex réunis</small></div>`;const q=state.search.trim();$('#agenda-results').innerHTML=`<div class="agenda-top"><h2>${q?'Résultats pour « '+esc(q)+' »':esc(longDate(state.agendaDate))}</h2><span class="date-nav-note">${rows.length} rendez-vous${q?' · toutes les dates':''}</span></div><p class="demo-note">${q?'La recherche affiche une liste sur toutes les dates. Effacez-la pour retrouver le planning.':'Agenda et indicateurs de démonstration · accès libre.'}</p>${rows.length?(q||state.agendaView==='list'?listRows(rows):planning(rows)):`<p class="empty">${q?'Aucun rendez-vous ne correspond à votre recherche.':openDay(state.agendaDate)?'La journée est libre. Ajoutez une réservation démo pour la voir apparaître ici.':'Le salon est fermé le dimanche et le lundi.'}</p>${!q&&openDay(state.agendaDate)&&state.agendaView==='planning'?planning([]):''}`}`;$('#agenda-date').disabled=!!q;document.querySelectorAll('[data-day]').forEach(b=>b.disabled=!!q)}
function render(){const active=document.activeElement;const focusId=active?.id;const selection=typeof active?.selectionStart==='number'?active.selectionStart:null;$('#root').innerHTML=header()+(state.view==='booking'?bookingPage():agendaPage())+footer();if(state.view==='agenda')renderAgendaResults();const target=focusId&&document.getElementById(focusId);if(target){target.focus({preventScroll:true});if(selection!==null&&target.type==='search')target.setSelectionRange(selection,selection)}if(!persistent)toast('Stockage local indisponible : les essais restent en mémoire jusqu’au rechargement.')}
function goToReservation(){document.getElementById('reservation')?.scrollIntoView({behavior:'smooth',block:'start'})}
function rememberContact(){const form=$('#booking-form');if(form){const f=new FormData(form);state.contact={name:String(f.get('name')||''),email:String(f.get('email')||''),phone:String(f.get('phone')||''),consent:f.has('consent')}}}
function openEditor(id){const b=memory.find(b=>b.id===id);if(!b){toast('Ce rendez-vous n’existe plus.');return}const dialog=$('#edit-dialog');dialog.className='demo-dialog';dialog.innerHTML=`<form id="edit-form" data-id="${esc(b.id)}"><div class="dialog-top"><div><div class="eyebrow">MODIFIER UN RENDEZ-VOUS DÉMO</div><h2 id="edit-title">Un autre moment ?</h2></div><button class="dialog-close" type="button" data-close="edit-dialog" aria-label="Fermer la modification">×</button></div><p class="dialog-note">Changez la prestation, le professionnel ou l’horaire. Le créneau précédent sera libéré après l’enregistrement.</p><div class="details-grid"><label>Prestation<select name="service" id="edit-service">${SERVICES.map(s=>`<option value="${s.id}" ${s.id===b.service?'selected':''}>${s.name} · ${s.duration} min · ${s.price} €</option>`).join('')}</select></label><label>Professionnel<select name="staff" id="edit-staff">${STAFF.map(s=>`<option ${s===b.staff?'selected':''}>${s}</option>`).join('')}</select></label><label>Date<input name="date" id="edit-date" type="date" min="${today()}" max="${addDays(today(),89)}" value="${b.date}" required></label><label>Horaire disponible<select name="start" id="edit-start" required></select></label><label class="wide">Nom et prénom<input name="name" minlength="2" maxlength="100" value="${esc(b.name)}" required></label><label>E-mail fictif<input name="email" type="email" maxlength="200" value="${esc(b.email)}" required></label><label>Téléphone fictif<input name="phone" type="tel" minlength="7" maxlength="25" value="${esc(b.phone)}" required></label></div><p id="edit-slot-note" class="dialog-note"></p><div id="edit-summary" class="edit-summary"></div><p id="edit-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="outline" data-close="edit-dialog">Fermer sans modifier</button><button id="save-edit" class="primary" type="submit">Enregistrer les modifications ✓</button></div><p class="demo-note">Réf. ${esc(b.id)} · Simulation uniquement.</p><button type="button" class="back" data-cancel="${esc(b.id)}">Annuler ce rendez-vous</button></form>`;refreshEditorSlots(b.start);dialog.showModal()}
function refreshEditorSlots(preferred){const f=$('#edit-form');if(!f)return;const date=f.elements.date.value,service=f.elements.service.value,staff=f.elements.staff.value;const selected=preferred??Number(f.elements.start.value);const slots=availableSlots(date,service,staff,f.dataset.id);f.elements.start.innerHTML=slots.length?slots.map(m=>`<option value="${m}" ${m===selected?'selected':''}>${time(m)} — ${time(m+serviceById(service).duration)}</option>`).join(''):'<option value="">Aucun créneau disponible</option>';$('#save-edit').disabled=!slots.length;$('#edit-slot-note').textContent=slots.length?'Les horaires proposés tiennent compte des autres rendez-vous.':'Choisissez une autre date ou un autre professionnel. Les créneaux passés ne peuvent pas être réservés.';$('#edit-error').hidden=true;refreshEditorSummary()}
function refreshEditorSummary(){const f=$('#edit-form');const s=serviceById(f.elements.service.value);$('#edit-summary').textContent=s.name+' · '+s.duration+' minutes · '+s.price+' € · avec '+f.elements.staff.value}
function askCancel(id){const b=memory.find(b=>b.id===id);if(!b)return;const dialog=$('#cancel-dialog');dialog.className='demo-dialog';dialog.innerHTML=`<div class="dialog-top"><h2 id="cancel-title">Annuler ce rendez-vous ?</h2><button class="dialog-close" data-close="cancel-dialog" aria-label="Fermer">×</button></div><p>${esc(b.name)} · ${esc(longDate(b.date))} à ${time(b.start)} avec ${b.staff}.</p><p class="dialog-note">Le créneau sera libéré dans la démo.</p><div class="dialog-actions"><button class="outline" data-close="cancel-dialog">Conserver</button><button class="primary danger-primary" data-confirm-cancel="${esc(id)}">Annuler le rendez-vous</button></div>`;dialog.showModal()}
document.addEventListener('click',event=>{const button=event.target.closest('button,a[data-action]');if(!button)return;const d=button.dataset;
 if(d.close){document.getElementById(d.close).close();return}
 if(d.edit){openEditor(d.edit);return}
 if(d.cancel){if(document.getElementById("edit-dialog").open)document.getElementById("edit-dialog").close();askCancel(d.cancel);return}
 if(d.confirmCancel){cancelAppointment(d.confirmCancel);$('#cancel-dialog').close();render();toast('Rendez-vous annulé. Le créneau est de nouveau disponible.');return}
 if(d.service){state.service=d.service;state.start=null;render();return}
 if(d.staff){state.staff=d.staff;state.start=null;render();return}
 if(d.slot!==undefined){state.start=Number(d.slot);render();return}
 if(d.date){state.date=d.date;state.calendarMonth=d.date.slice(0,7);state.start=null;render();return}
 if(d.month){const month=state.calendarMonth||state.date.slice(0,7);const next=new Date(Date.UTC(Number(month.slice(0,4)),Number(month.slice(5))-1+Number(d.month),1)).toISOString().slice(0,7);if(next>=today().slice(0,7)&&next<=addDays(today(),89).slice(0,7)){state.calendarMonth=next;render()}return}
 if(d.day){state.agendaDate=addDays(state.agendaDate,Number(d.day));render();return}
 if(d.display){state.agendaView=d.display;render();return}
 if(!d.action)return;
 if(d.action==='home')event.preventDefault();
 rememberContact();
 switch(d.action){
 case 'home':case 'booking':state.view='booking';render();if(d.action==='home')window.scrollTo({top:0,behavior:'smooth'});break;
 case 'agenda':state.view='agenda';render();window.scrollTo({top:0,behavior:'smooth'});break;
 case 'continue':if(availableSlots(state.date,state.service,state.staff).includes(state.start)){state.step=2;render();goToReservation();$('#booking-form input[name="name"]').focus({preventScroll:true})}else{state.start=null;render();toast('Choisissez un créneau disponible.')}break;
 case 'back':state.step=1;render();goToReservation();break;
 case 'prefill':state.contact={name:'Sophie Dupont',email:'sophie.dupont@example.com',phone:'+32 470 00 00 00',consent:false};render();toast('Coordonnées fictives ajoutées. Cochez la case pour confirmer l’essai.');break;
 case 'new':state.step=1;state.start=null;state.contact={name:'',email:'',phone:'',consent:false};state.confirmedId='';render();goToReservation();break;
 case 'show-confirmed':{const b=memory.find(b=>b.id===state.confirmedId);if(b){state.agendaDate=b.date;state.search='';state.agendaView='planning';state.view='agenda';render();window.scrollTo({top:0,behavior:'smooth'})}break}
 case 'clear-search':state.search='';$('#client-search').value='';renderAgendaResults();$('#client-search').focus();break;
 case 'reserve-from-agenda':state.view='booking';state.step=1;state.date=validDate(state.agendaDate)?state.agendaDate:nextOpenDate();state.start=null;state.calendarMonth=state.date.slice(0,7);render();goToReservation();break;
 case 'reset':if(confirm('Effacer les essais et restaurer les rendez-vous fictifs de la démo ?')){persist(seedRows());state.step=1;state.start=null;state.confirmedId='';state.contact={name:'',email:'',phone:'',consent:false};state.date=nextOpenDate();state.calendarMonth=state.date.slice(0,7);state.agendaDate=nextOpenDate();state.search='';render();toast('La démo a été réinitialisée avec cinq journées de rendez-vous fictifs.')}break;
 }
});
document.addEventListener('input',event=>{if(event.target.id==='client-search'){state.search=event.target.value;renderAgendaResults()}});
document.addEventListener('change',event=>{const node=event.target;if(node.id==='booking-date'){if(!node.value)return;state.date=node.value;state.calendarMonth=node.value.slice(0,7);state.start=null;render()}else if(node.id==='agenda-date'){if(!node.value)return;state.agendaDate=node.value;renderAgendaResults()}else if(['edit-date','edit-service','edit-staff'].includes(node.id)){refreshEditorSlots()}else if(node.id==='edit-start'){refreshEditorSummary()}});
document.addEventListener('submit',event=>{const form=event.target;if(!['booking-form','edit-form'].includes(form.id))return;event.preventDefault();const f=new FormData(form);
 if(form.id==='booking-form'){rememberContact();try{if(!state.contact.consent)throw Error('Confirmez qu’il s’agit d’une simulation.');const b=saveAppointment({...state.contact,date:state.date,service:state.service,staff:state.staff,start:state.start});state.confirmedId=b.id;state.step=3;render();goToReservation();toast('Réservation démo ajoutée au planning.')}catch(error){const alert=$('#booking-error');alert.textContent=error.message;alert.hidden=false;alert.scrollIntoView({block:'nearest'})}}
 else{try{const start=f.get('start');const b=saveAppointment({date:f.get('date'),service:f.get('service'),staff:f.get('staff'),start:start===''?null:Number(start),name:f.get('name'),email:f.get('email'),phone:f.get('phone')},form.dataset.id);$('#edit-dialog').close();if(state.view==='agenda'){state.agendaDate=b.date;state.search=''}if(state.confirmedId===b.id){state.date=b.date;state.staff=b.staff;state.service=b.service;state.start=b.start}render();toast('Rendez-vous modifié. L’ancien créneau est libéré.')}catch(error){const alert=$('#edit-error');alert.textContent=error.message;alert.hidden=false}}
});
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY){try{rememberContact();memory=cleanRows(JSON.parse(event.newValue||'[]'));render();if($('#edit-dialog').open)refreshEditorSlots()}catch{}}});
render();
</script>
</body></html>
