<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Albert — aperçu avec mouvement de caméra</title><style>body{margin:0;background:#171512;color:#f8edda;font:17px system-ui;display:grid;min-height:100vh;place-content:center;padding:20px;box-sizing:border-box}main{max-width:1200px}section{overflow:hidden;aspect-ratio:16/9;border-radius:12px;background:#000}img{width:100%;height:100%;object-fit:cover;transform-origin:48% 40%;animation:camera 8s ease-in-out infinite alternate}h1{font-size:22px}p{color:#d2c3ae}button{padding:10px 20px;background:#ecd2a0;border:0;border-radius:8px;font:inherit;cursor:pointer}@keyframes camera{from{transform:scale(1)}to{transform:scale(1.12)}}@media(prefers-reduced-motion:reduce){img{animation-play-state:paused}}</style><main><h1>Albert — aperçu 3D</h1><section><img src="albert-apercu-3d-v1.png" alt="Albert regarde son téléphone, assis dans son fauteuil."></section><p>Mouvement de caméra sur une image fixe. Les gestes et les expressions ne sont pas animés. Sans son.</p><button onclick="const im=document.querySelector('img');const pause=getComputedStyle(im).animationPlayState!=='paused';im.style.animationPlayState=pause?'paused':'running';this.textContent=pause?'Lire':'Pause'">Pause</button></main></html>
